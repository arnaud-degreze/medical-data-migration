services:
    mongodb:
        image: mongo:7.0.41
        container_name: mongodb_medical
        ports:
            - "127.0.0.1:27017:27017"
        env_file: .env
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
            MONGO_MIGRATION_USERNAME: ${MONGO_MIGRATION_USERNAME}
            MONGO_MIGRATION_PASSWORD: ${MONGO_MIGRATION_PASSWORD}
            MONGO_ANALYST_USERNAME: ${MONGO_ANALYST_USERNAME}
            MONGO_ANALYST_PASSWORD: ${MONGO_ANALYST_PASSWORD}
        volumes:
            - mongodb_medical_data:/data/db
            - ./mongo_init:/docker-entrypoint-initdb.d:ro
        networks:
            - medical_network
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 3s
            retries: 10
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CAP_CHOWN               # Required by mongodb to changes files UIDs and GIDs
            - CAP_SETUID              # Required by gosu to setuid() to mongodb user
            - CAP_SETGID              # Required by gosu to setgid() to mongodb group
            - CAP_DAC_OVERRIDE        # Bypass file read, write, and execute permission checks.
            - CAP_SYS_RESOURCE
            - CAP_SYSLOG              # read and/or clear kernel message ring buffer

    migration:
        image: python3.13_uv:latest
        build:
            context: .
            dockerfile: Dockerfile
        command: >
            sh -c "uv run pytest && uv run medical_migration"
        networks:
            - medical_network
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            MONGODB_URI: "mongodb://mongodb:27017"
            MONGODB_DB_NAME: "medical"
        restart: "no"
        volumes:
            - ./data:/app/data:ro
#        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true

volumes:
    mongodb_medical_data:

networks:
    medical_network:
        name: medical_network
        driver: bridge
